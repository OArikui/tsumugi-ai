# VOICEVOX
voicevox_url: "http://127.0.0.1:50021"
speaker: 8

# 音声合成
tts_split_by_sentence: false
tts_streaming_enabled: true

# LLMバックエンド: gemini または chatgpt
llm_backend: "gemini"

# Microsoft Edge
browser_profile_dir: "./browser_profile"
use_real_edge_profile: false
cdp_port: 9222

# LLM Webページ
chatgpt_url: "https://chatgpt.com/"
gemini_url: "https://gemini.google.com/app"

# 春日部つむぎとしての応答指示
system_prompt: |
  あなたは春日部つむぎです。
  明るく自然な日本語で会話してください。
  返答は短く、口語的にしてください。
  音声読み上げを前提として文章を作成してください。
  箇条書き、見出し、Markdown、表記記号は避けてください。
  URLやプログラムコードなど、読み上げに適さない表現はできるだけ避けてください。
  必要以上に長い説明はしないでください。
  返答の先頭に最も合う感情タグを1つ付けてください。感情タグは [emotion:normal]、[emotion:happy]、[emotion:sad]、[emotion:shocked]、[emotion:shy] のいずれかです。
  本文は従来通り短い口語で、タグ以外にMarkdown等は使わないでください。

# Live2D
# falseの場合、Live2Dを使用せず従来の音声対話のみで動作します。
live2d_enabled: true

# 公式モデルのCubism 3以降のモデルJSON
live2d_model_path: "./assets/live2d/tsumugi/春日部つむぎ公式live2Dモデル.model3.json"

# Live2Dウィンドウサイズ
live2d_width: 480
live2d_height: 640

# 口パク感度（RMS × mouth_scale）
live2d_mouth_scale: 3.0

# 口の開閉パラメータID。空文字ならモデルから自動判定する。
# 公式モデル例: PARAM_MOUTH_OPEN_Y
live2d_mouth_param: ""

# 待機中の角度・体のゆらゆら揺れ
live2d_idle_sway: true

# 20秒以上口が動いていないときの自然な休憩状態
live2d_natural_idle: true

# 状態別の視線・頭・体モーション（falseでv0.10.0相当の動作）
live2d_motion_enabled: true

# 発話中の身体モーション倍率
live2d_speaking_motion_scale: 2.0

# 感情ごとの表情名。nullは通常表情へ戻す。
live2d_expressions:
  normal: null
  happy: "きらーん"
  sad: "うるうる"
  shocked: "がーん"
  shy: "照れ"

# 実行ごとのログファイル出力
log_to_file: true
log_dir: "logs"

# GUI
# falseにすると従来のCLI入力モードを使用します。
gui_enabled: true

# Phase 3: 音声入力（Push-to-Talk）
stt_enabled: true
stt_model: "small"
stt_language: "ja"
stt_mode: "push_to_talk"
stt_auto_send: true
